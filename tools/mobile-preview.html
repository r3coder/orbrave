<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Mobile preview</title>
  <!-- Dev tool (npm run dev → /tools/mobile-preview.html): the orb page at several phone sizes side by
       side. The frames share one origin, so they share localStorage (tutorial progress, session).
       편집 열림 needs the dev build (window.__orbs). -->
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0b0b10; color: #ccc; font: 13px/1.5 ui-monospace, Consolas, monospace; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: #15151d; border-bottom: 1px solid #2a2a36; }
    header b { color: #fff; letter-spacing: 0.1em; }
    button, select { font: inherit; color: inherit; background: #20202a; border: 1px solid #333344; padding: 5px 10px; cursor: pointer; }
    button:hover { border-color: #39ff9c; }
    label { display: flex; gap: 6px; align-items: center; }
    main { display: flex; flex-wrap: wrap; gap: 28px 24px; align-items: flex-start; padding: 20px 16px 60px; }
    figure { margin: 0; }
    figcaption { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; white-space: nowrap; }
    figcaption small { color: #777; }
    figcaption button { padding: 1px 6px; font-size: 11px; }
    .box { overflow: hidden; border: 1px solid #333344; border-radius: 14px; background: #000; }
    iframe { display: block; border: 0; transform-origin: 0 0; }
  </style>
</head>
<body>
  <header>
    <b>● ORBRAVE · mobile preview</b>
    <label>배율 <input id="scale" type="range" min="0.35" max="1" step="0.05" value="0.6" /> <span id="scaleOut"></span></label>
    <label>상태
      <select id="state">
        <option value="keep">그대로</option>
        <option value="first">첫 방문 (튜토리얼 처음부터)</option>
        <option value="slots">슬롯 열림 (5개 던진 뒤)</option>
        <option value="all">모든 기능 열림</option>
        <option value="song" selected>곡 6개 (튜토리얼 끝)</option>
        <option value="roll">곡 6개 + 편집 열림</option>
      </select>
    </label>
    <button id="reload">↻ 전부 새로고침</button>
    <label title="주소창·상태바를 뺀 높이 (추정: iPhone Safari −193, Android Chrome −110)"><input id="bars" type="checkbox" checked /> 브라우저 안 높이</label>
    <label><input id="old" type="checkbox" /> 작은 폰 (SE · 320)</label>
    <label><input id="land" type="checkbox" /> 가로 화면 포함</label>
  </header>
  <main id="grid"></main>
  <script>
    // 2023–2026 flagships: [name, CSS width, full CSS height, browser bars to take off for 브라우저 안].
    // Sizes from yesviz / resolution ÷ pixel ratio; bars estimated (iPhone Safari ~190, Android Chrome ~110)
    const DEVICES = [
      ['Galaxy S23 · S24 · S25', 360, 780, 110],
      ['Galaxy S24+ · S25+ · Ultra', 412, 891, 110],
      ['Galaxy Z Flip 7', 360, 840, 110],
      ['Galaxy Z Fold 5·6 커버', 344, 882, 110],
      ['Pixel 8 · 9 · 10', 412, 915, 110],
      ['Pixel 9 · 10 Pro XL', 448, 997, 110],
      ['iPhone 16e', 390, 844, 193],
      ['iPhone 15 · 16', 393, 852, 193],
      ['iPhone 16 Pro · 17', 402, 874, 193],
      ['iPhone Air', 420, 912, 193],
      ['iPhone 15 Plus · 16 Plus', 430, 932, 193],
      ['iPhone 16 · 17 Pro Max', 440, 956, 193],
      ['Galaxy Z Fold 5·6 펼침', 690, 829, 110],
      ['Pixel 10 Pro Fold 펼침', 692, 717, 110],
      ['Galaxy Z Fold 7 펼침', 984, 1092, 110],
    ];
    const OLD = [['iPhone SE', 375, 667, 0], ['Small (320)', 320, 568, 0]];
    const LAND = [['iPhone 15 가로', 852, 393, 0], ['iPad mini 세로', 768, 1024, 0], ['iPad mini 가로', 1024, 768, 0]];
    const grid = document.getElementById('grid');
    const scaleEl = document.getElementById('scale');
    const frames = [];
    const url = () => '/index.html?preview=' + Date.now();

    function build() {
      grid.innerHTML = '';
      frames.length = 0;
      const bars = document.getElementById('bars').checked;
      const list = [...DEVICES, ...(document.getElementById('old').checked ? OLD : []), ...(document.getElementById('land').checked ? LAND : [])];
      for (const [name, w, full, cut] of list) {
        const h = bars ? full - cut : full;
        const fig = document.createElement('figure');
        fig.innerHTML = `<figcaption><span>${name}</span><small>${w}×${h}</small><button title="이 화면만 새로고침">↻</button><button title="새 창으로">⧉</button></figcaption><div class="box"><iframe></iframe></div>`;
        const ifr = fig.querySelector('iframe');
        ifr.width = w;
        ifr.height = h;
        const [re, pop] = fig.querySelectorAll('button');
        re.onclick = () => load(ifr);
        pop.onclick = () => window.open('/index.html', name, `width=${w},height=${h}`);
        frames.push({ fig, ifr, w, h });
        grid.append(fig);
      }
      rescale();
      reloadAll();
    }
    function rescale() {
      const s = +scaleEl.value;
      document.getElementById('scaleOut').textContent = Math.round(s * 100) + '%';
      for (const { fig, ifr, w, h } of frames) {
        ifr.style.transform = `scale(${s})`;
        const box = fig.querySelector('.box');
        box.style.width = w * s + 'px';
        box.style.height = h * s + 'px';
      }
    }
    // tutorial progress lives in localStorage (src/orbs.js TUT_KEY / FIRST_ORB_KEY)
    function applyState() {
      const v = document.getElementById('state').value;
      if (v === 'keep') return;
      for (const k of ['orbTutorial', 'orbFirstOrb', 'orbSession', 'orbRollReady', 'orbToolsReady']) localStorage.removeItem(k);
      if (v === 'first') return;
      localStorage.setItem('orbFirstOrb', '1');
      const step = v === 'slots' ? 2 : 6;
      localStorage.setItem('orbTutorial', JSON.stringify({ step, thrown: step === 6 ? 20 : 5, moves: 20, thrownAt: 0, movesAt: 0, at: Date.now(), banner: false, bannerMoves: 0, used: false, combo: true }));
      if (v !== 'song' && v !== 'roll') return;
      // a song restored from the session (src/orbs.js restoreSession)
      localStorage.setItem('orbSession', JSON.stringify({
        layers: ['kick2', 'hat2', 'bass1', 'pad2', 'lead2', 'arp2'], drawn: [], copies: [],
        stash: ['snare3', 'perc4', 'lead5', 'fx2', 'bass7'], variation: 0, seeds: {}, steps: {}, held: {}, name: '',
        slots: { louder: { id: 'hat4', home: null } },
        roll: v === 'roll' ? { id: 'lead7', home: null, src: 'lead7', raw: Array(64).fill(null), edited: false, seed: null } : null,
      }));
    }
    // 편집 열림: once a frame has booted, draw lead7's own notes into its roll (dev build: window.__orbs)
    function fillRoll(ifr) {
      if (document.getElementById('state').value !== 'roll') return;
      const O = ifr.contentWindow?.__orbs;
      if (!O?.draft) return setTimeout(() => fillRoll(ifr), 500);
      const raw = O.patternToRaw(O.byId.lead7);
      if (raw) O.draft.raw = raw;
    }
    let sess = null; // the session the state set up, handed to each frame as it loads
    function load(ifr) {
      if (sess) localStorage.setItem('orbSession', sess);
      ifr.onload = () => setTimeout(() => fillRoll(ifr), 1500);
      ifr.src = url();
    }
    function reloadAll() {
      // a frame saves its session as it unloads: empty them all first, then set the state
      for (const f of frames) {
        f.ifr.onload = null;
        f.ifr.src = 'about:blank';
      }
      setTimeout(() => {
        applyState();
        // one at a time (each frame boots the sample bank); each reads the session on boot and
        // may write it back, so each gets a fresh copy
        sess = localStorage.getItem('orbSession');
        frames.forEach((f, i) => setTimeout(() => load(f.ifr), i * 600));
      }, 400);
    }
    scaleEl.oninput = rescale;
    document.getElementById('reload').onclick = reloadAll;
    document.getElementById('state').onchange = reloadAll;
    for (const id of ['land', 'old', 'bars']) document.getElementById(id).onchange = build;
    build();
  </script>
</body>
</html>
