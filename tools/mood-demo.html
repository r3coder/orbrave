<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mood visuals demo</title>
  <style>
    :root { --bg: #0b0b10; --panel: #14141c; --line: #2a2a38; --ink: #e6e6ee; --dim: #8a8aa0; --acc: #7c6cff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, 'Malgun Gothic', sans-serif; display: grid; grid-template-columns: 1fr 380px; height: 100vh; overflow: hidden; }
    #stage { position: relative; overflow: hidden; }
    #viz { position: absolute; inset: 0; width: 100%; height: 100%; }
    #core { position: absolute; width: 92px; height: 92px; border-radius: 50%; border: 2px solid #ffffff55; background: #15151dcc; display: grid; place-items: center; font-size: 26px; transform: translate(-50%, -50%); left: 50%; top: 50%; pointer-events: none; }
    #hud { position: absolute; left: 14px; bottom: 12px; right: 14px; color: var(--dim); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    #hud button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
    #hud button.on { border-color: var(--acc); color: #fff; }
    aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p.note { color: var(--dim); margin: 0 0 12px; }
    h2 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 6px; }
    .orb { display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; width: 100%; text-align: left; background: none; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; margin-bottom: 5px; cursor: pointer; font: inherit; }
    .orb:hover { border-color: #444458; }
    .orb.on { border-color: var(--acc); background: #7c6cff1a; }
    .dot { grid-row: span 2; width: 18px; height: 18px; border-radius: 50%; margin-top: 2px; }
    .kind { color: var(--dim); font-size: 11px; }
    .fx { grid-column: 2; font: 11px ui-monospace, Consolas, monospace; color: #9b9bb5; word-break: break-all; }
    #meters { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 4px; }
    .m { display: grid; grid-template-columns: 1fr 70px; gap: 2px 8px; align-items: center; }
    .m b { font-weight: 600; }
    .m small { grid-column: 1 / -1; color: var(--dim); }
    .bar { height: 6px; background: #22222e; border-radius: 3px; position: relative; overflow: hidden; }
    .bar i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--acc); border-radius: 3px; }
    .bar.neg i { background: #ff7a6c; }
    label.row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
    input[type=range] { flex: 1; }
    @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="viz"></canvas>
    <div id="core">▶</div>
    <div id="hud">
      <button id="compare" title="누르고 있는 동안 분위기 효과 없이 보기">누르고 있으면: 효과 끄고 비교</button>
      <button id="clear">모두 해제</button>
      <span>가짜 드럼 패턴 · 124 BPM (소리 없음, 화면만)</span>
    </div>
  </div>
  <aside>
    <h1>분위기 오브 화면 효과 데모</h1>
    <p class="note">분위기 오브를 눌러 켜고 끄세요 (여러 개 겹치기 가능). 오브 페이지와 같은 코드(src/moodVisuals.js, src/hitRipples.js)로 그려요. 효과는 오브의 코드에서 읽어요.</p>
    <label class="row">세기 <input id="step" type="range" min="-3" max="3" step="1" value="0" /> <span id="stepv">0</span></label>
    <h2>지금 적용된 효과</h2>
    <div id="meters"><p class="note">켜진 분위기 오브 없음 → 효과 없음</p></div>
    <div id="list"></div>
  </aside>
  <script type="module" src="./mood-demo.js"></script>
</body>
</html>
